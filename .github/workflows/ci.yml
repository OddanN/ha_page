name: CI
run-name: ${{ inputs.run_name || format('CI · {0} · {1}', github.event_name, github.ref_name) }}

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      run_name:
        description: Custom workflow run name
        required: false
        type: string
      prepared_pages_build:
        description: Internal flag for a prepared pages-build commit
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 */6 * * *"
    - cron: "31 4 1 * *"
  release:
    types:
      - created

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.prepared_pages_build && github.ref || (github.event_name == 'push' && github.ref || 'pages-refresh') }}
  cancel-in-progress: true

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pylint
        run: python -m pip install --upgrade pip pylint

      - name: Run pylint
        shell: bash
        run: |
          set -o pipefail
          pylint --rcfile=.pylintrc scripts/generate_site_data.py | tee pylint-report.txt

      - name: Upload pylint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pylint-report
          path: pylint-report.txt

  trigger-pages-refresh:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.prepared_pages_build) ||
      github.event_name == 'release' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *')
    needs: pylint
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create a unique Pages build version
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          REFRESH_REASON: ${{ inputs.run_name || format('{0} from {1}', github.event_name, github.ref_name) }}
        shell: bash
        run: |
          {
            echo "timestamp=$(date --utc --iso-8601=seconds)"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "source_ref=${SOURCE_REF}"
            echo "source_sha=${SOURCE_SHA}"
            echo "reason=${REFRESH_REASON}"
          } > .pages-build-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-build-version
          git commit -m "chore: prepare GitHub Pages build ${GITHUB_RUN_ID}"
          git push --force origin HEAD:pages-build

          gh workflow run ci.yml \
            --ref pages-build \
            -f "run_name=${REFRESH_REASON}" \
            -f prepared_pages_build=true

  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.prepared_pages_build)
    needs: pylint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve site source ref
        id: source
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "pages-build" ]; then
            SOURCE_REF="$(sed -n 's/^source_ref=//p' .pages-build-version)"
            if [[ ! "${SOURCE_REF}" =~ ^refs/(heads|tags)/[-A-Za-z0-9._/]+$ ]]; then
              echo "Invalid source_ref in .pages-build-version: ${SOURCE_REF}" >&2
              exit 1
            fi
          else
            SOURCE_REF="${GITHUB_SHA}"
          fi

          echo "ref=${SOURCE_REF}" >> "${GITHUB_OUTPUT}"
          echo "Building site source from ${SOURCE_REF}"

      - name: Check out site source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate site data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_site_data.py

      - name: Prepare site artifact
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          cp -r assets dist/assets
          cp -r data dist/data
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '31 4 1 * *'
    needs: pylint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Keep scheduled workflow active
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active"
          git push
